<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard COFTAH</title>
    <style>
        :root { --bg-principal: #0A192F; --bg-paneles: #112240; --texto-principal: #FFFFFF; --texto-secundario: #8892B0; --acento-amarillo: #FFD700; --urgencia-baja: #64FFDA; --urgencia-media: #FFD700; --urgencia-alta: #FF8C00; --urgencia-critica: #FF3366; --completado: #2E8B57; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-principal); color: var(--texto-principal); height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 15px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--bg-paneles); }
        .brand { display: flex; align-items: center; gap: 15px; }
        .brand img { height: 45px; width: auto; }
        .titulos { display: flex; flex-direction: column; justify-content: center; }
        .titulos h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 1px; margin-bottom: 2px; }
        #subtitulo-vista { font-size: 1rem; color: var(--acento-amarillo); font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; }
        .header-derecha { display: flex; align-items: center; gap: 20px; }
        
        .estado-conexion { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--urgencia-baja); font-weight: bold; margin-right: 10px; }
        .punto-verde { width: 10px; height: 10px; background-color: var(--urgencia-baja); border-radius: 50%; box-shadow: 0 0 8px var(--urgencia-baja); animation: titilar 2s infinite; }
        @keyframes titilar { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .reloj { font-size: 1.8rem; font-weight: bold; color: var(--acento-amarillo); font-family: monospace; display: flex; align-items: center; }
        #semana-actual { color: var(--texto-principal); font-size: 1.3rem; margin-right: 10px; font-family: 'Segoe UI', sans-serif; }
        
        .menu-container { position: relative; }
        .btn-hamburguesa { background: none; border: none; color: var(--texto-principal); font-size: 2.2rem; cursor: pointer; padding: 0 10px; }
        .menu-desplegable { display: none; position: absolute; top: 110%; right: 0; background-color: var(--bg-paneles); border: 1px solid var(--texto-secundario); border-radius: 8px; padding: 15px; z-index: 1000; min-width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); flex-direction: column; gap: 10px; }
        .menu-desplegable.show { display: flex; }
        .menu-item { background-color: transparent; color: var(--texto-secundario); border: none; padding: 12px; text-align: left; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 5px; text-transform: uppercase; }
        .menu-item:hover { background-color: rgba(255, 215, 0, 0.1); color: var(--texto-principal); }
        .menu-item.active { background-color: rgba(255, 215, 0, 0.15); color: var(--acento-amarillo); border-left: 4px solid var(--acento-amarillo); }
        .filtros-semanales { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .filtros-semanales select { width: 100%; background-color: var(--bg-principal); color: var(--texto-principal); border: 1px solid var(--texto-secundario); padding: 10px; font-size: 1rem; font-weight: bold; border-radius: 5px; cursor: pointer; }
        
        .vista { display: none; background-color: var(--bg-paneles); flex: 1; border-radius: 12px; padding: 20px; flex-direction: column; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); overflow: hidden; }
        .vista.active { display: flex; }
        
        .fila-header, .fila-item { display: grid; gap: 15px; align-items: center; padding: 12px 15px; border-radius: 8px; }
        .grid-clientes { grid-template-columns: 80px 50px 2fr 1fr 1.5fr 1fr 100px 110px; }
        .grid-tareas { grid-template-columns: 1fr 3fr 100px 100px 120px 110px; }
        
        .fila-header { font-size: 0.9rem; color: var(--texto-secundario); text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        .fila-item { background-color: rgba(255, 255, 255, 0.03); margin-bottom: 8px; transition: all 0.3s ease; cursor: pointer; }
        .fila-item:hover { background-color: rgba(255, 255, 255, 0.08); transform: translateY(-2px); }
        .logo-cliente { width: 35px; height: 35px; background-color: white; border-radius: 50%; object-fit: contain; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; text-align: center; display: inline-block; width: 100%; }
        
        .estatus-rutina, .estatus-programado { background-color: var(--urgencia-baja); color: #000; }
        .estatus-importante { background-color: var(--urgencia-media); color: #000; }
        .estatus-urgente { background-color: var(--urgencia-alta); color: #fff; }
        .estatus-critica, .estatus-retrasado { background-color: var(--urgencia-critica); color: #fff; }
        .estatus-completado { background-color: var(--completado); color: #fff; }
        .animacion-completado { animation: destelloVerde 1.5s ease-out forwards; }
        @keyframes destelloVerde { 0% { background-color: rgba(255, 255, 255, 0.03); transform: scale(1); } 50% { background-color: var(--completado); transform: scale(1.01); } 100% { background-color: rgba(46, 139, 87, 0.2); transform: scale(1); } }
        .contenedor-lista { flex-grow: 1; overflow-y: auto; padding-right: 10px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-paneles); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        /* NUEVO: ESTILOS PARA LA VENTANA MODAL */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: var(--bg-paneles); width: 90%; max-width: 650px; border-radius: 12px; border: 2px solid var(--acento-amarillo); overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; }
        .modal-header { background-color: rgba(255, 215, 0, 0.1); padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { color: var(--acento-amarillo); font-size: 1.5rem; margin: 0; text-transform: uppercase; }
        .modal-close { background: none; border: none; color: white; font-size: 2rem; cursor: pointer; line-height: 1; }
        .modal-body { padding: 25px; font-size: 1.1rem; line-height: 1.6; color: var(--texto-principal); }
        .modal-seccion { background-color: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--urgencia-baja); }
        .modal-seccion strong { color: var(--texto-secundario); display: block; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 5px; }
        .modal-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: flex-end; gap: 15px; background-color: rgba(0,0,0,0.2); }
        .btn-modal { padding: 12px 25px; border: none; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: all 0.3s; }
        .btn-modal-cancelar { background-color: transparent; color: white; border: 1px solid var(--texto-secundario); }
        .btn-modal-completar { background-color: var(--completado); color: white; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="COFTAH.png.png" alt="Logo" onerror="this.style.display='none'">
            <div class="titulos">
                <h1>COFTAH / TABLERO DE OPERACIONES</h1>
                <div id="subtitulo-vista">CRONOGRAMA DE CLIENTES</div>
            </div>
        </div>
        <div class="header-derecha">
            <div class="estado-conexion" id="estado-conexion">
                <div class="punto-verde"></div> Conectado
            </div>
            <div class="reloj">
                <span id="semana-actual">SEMANA --</span>
                <span style="color: var(--texto-secundario); margin: 0 10px;">|</span>
                <span id="reloj-digital">00:00:00</span>
            </div>
            <div class="menu-container">
                <button id="btn-menu" class="btn-hamburguesa" onclick="toggleMenu()">&#9776;</button>
                <div id="menu-desplegable" class="menu-desplegable">
                    <button class="menu-item active" id="btn-clientes" onclick="cambiarVista('clientes')">Cronograma de Clientes</button>
                    <button class="menu-item" id="btn-tareas" onclick="cambiarVista('tareas')">Delegación de Funciones</button>
                    <div class="filtros-semanales">
                        <label>Filtrar por Semana</label>
                        <select id="filtro-semana" onchange="renderizarVistas()"></select>
                        <div id="contenedor-filtro-responsable" style="display: none; margin-top: 10px;">
                            <label>Filtrar por Responsable</label>
                            <select id="filtro-responsable" onchange="renderizarVistas()">
                                <option value="TODOS">Todos los responsables</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="vista active" id="vista-clientes">
        <div class="fila-header grid-clientes">
            <div>Hora</div><div>Logo</div><div>Cliente</div><div>Lugar</div><div>Curso al detal</div><div>Facilitador</div><div>Día</div><div>Estatus</div>
        </div>
        <div class="contenedor-lista" id="lista-clientes"></div>
    </div>

    <div class="vista" id="vista-tareas">
        <div class="fila-header grid-tareas">
            <div>Responsable</div><div>Tarea Asignada</div><div>Día</div><div>Hora Límite</div><div>Tiempo Restante</div><div>Estatus</div>
        </div>
        <div class="contenedor-lista" id="lista-tareas"></div>
    </div>

    <!-- NUEVO: ESTRUCTURA DE LA VENTANA MODAL -->
    <div class="modal-overlay" id="modal-tarea">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-titulo">Detalles de la Misión</h2>
                <button class="modal-close" onclick="cerrarModal()">×</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Se llena dinámicamente con JS -->
            </div>
            <div class="modal-footer" id="modal-footer">
                <button class="btn-modal btn-modal-cancelar" onclick="cerrarModal()">Volver</button>
                <button class="btn-modal btn-modal-completar" id="btn-completar-modal">Marcar como Hecho</button>
            </div>
        </div>
    </div>

    <script>
        setInterval(() => { document.getElementById('reloj-digital').textContent = new Date().toLocaleTimeString('en-US', { hour12: true }); }, 1000);
        function toggleMenu() { document.getElementById('menu-desplegable').classList.toggle('show'); }
        document.addEventListener('click', function(e) { const menu = document.getElementById('menu-desplegable'); if (!menu.contains(e.target) && e.target.id !== 'btn-menu') menu.classList.remove('show'); });
        
        function getNumeroSemana(d) { d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7)); var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7); }
        function getDiaSemana(d) { let dia = d.getDay(); return dia === 0 ? 7 : dia; }
        
        function parseFechaLocal(fechaStr) {
            if (!fechaStr) return new Date();
            let limpia = fechaStr.endsWith('Z') ? fechaStr.slice(0, -1) : fechaStr;
            return new Date(limpia);
        }

        const nombresDias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

        function inicializarFiltrosSemanales() {
            const selectSemana = document.getElementById('filtro-semana'); let hoy = new Date();
            document.getElementById('semana-actual').textContent = `SEMANA ${getNumeroSemana(hoy)}`;
            let lunesActual = new Date(hoy); let dia = hoy.getDay() === 0 ? 7 : hoy.getDay();
            lunesActual.setDate(hoy.getDate() - dia + 1); lunesActual.setHours(0,0,0,0);
            
            selectSemana.innerHTML = '';
            for (let i = -2; i < 10; i++) { 
                let lunesSemana = new Date(lunesActual.getTime() + (i * 7 * 24 * 60 * 60 * 1000));
                let numSem = getNumeroSemana(lunesSemana);
                let label = `Semana ${numSem} (Inicio: ${lunesSemana.toLocaleDateString('es-ES', {day:'2-digit', month:'short'})})`;
                selectSemana.add(new Option(label, numSem));
            }
            selectSemana.value = getNumeroSemana(hoy);
        }

        let clientes = []; let tareas = [];
        let tareasAvisadas = new Set(); let clientesConocidos = new Set(); let tareasConocidas = new Set(); let esPrimeraCarga = true;

        async function cargarDatos() {
            const ind = document.getElementById('estado-conexion');
            ind.innerHTML = `<div class="punto-verde" style="background-color: var(--acento-amarillo); box-shadow: 0 0 8px var(--acento-amarillo);"></div> Actualizando...`;
            
            try {
                const conf = { cache: 'no-store', headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' } };
                const ts = new Date().getTime();
                
                const resClientes = await fetch('/api/clientes?t=' + ts, conf);
                if(resClientes.ok) clientes = await resClientes.json();
                
                const resTareas = await fetch('/api/tareas?t=' + ts, conf);
                if(resTareas.ok) tareas = await resTareas.json();
                
                const responsablesUnicos = [...new Set(tareas.map(t => t.responsable))].sort();
                const selectResp = document.getElementById('filtro-responsable');
                const valorActualResp = selectResp.value;
                selectResp.innerHTML = '<option value="TODOS">Todos los responsables</option>';
                responsablesUnicos.forEach(r => selectResp.add(new Option(r, r)));
                if (responsablesUnicos.includes(valorActualResp)) selectResp.value = valorActualResp;

                if (esPrimeraCarga) {
                    clientes.forEach(c => clientesConocidos.add(c.id));
                    tareas.forEach(t => tareasConocidas.add(t.id));
                    esPrimeraCarga = false;
                } else {
                    clientes.forEach(c => { 
                        if (!clientesConocidos.has(c.id)) { 
                            hablar(`Atención. Nuevo programa registrado para la semana ${getNumeroSemana(new Date(c.fecha_atencion))}: ${c.nombre_cliente}.`); 
                            clientesConocidos.add(c.id); 
                        }
                    });
                    tareas.forEach(t => { 
                        if (!tareasConocidas.has(t.id)) { 
                            let msj = t.nombre_cliente
                                ? `Atención. Nueva función delegada a ${t.responsable} para el cliente ${t.nombre_cliente}.`
                                : `Atención. Nueva función delegada a ${t.responsable}.`;
                            hablar(msj); 
                            tareasConocidas.add(t.id); 
                        }
                    });
                }
                
                renderizarVistas();
                setTimeout(() => { ind.innerHTML = `<div class="punto-verde"></div> Conectado`; }, 1000);
            } catch (error) {
                ind.innerHTML = `<div class="punto-verde" style="background-color: var(--urgencia-critica); box-shadow: 0 0 8px var(--urgencia-critica);"></div> Desconectado`;
            }
        }

        function cambiarVista(vistaId) {
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
            document.getElementById(`vista-${vistaId}`).classList.add('active');
            document.getElementById(`btn-${vistaId}`).classList.add('active');
            document.getElementById('subtitulo-vista').textContent = vistaId === 'tareas' ? 'DELEGACIÓN DE FUNCIONES' : 'CRONOGRAMA DE CLIENTES';
            document.getElementById('contenedor-filtro-responsable').style.display = vistaId === 'tareas' ? 'block' : 'none';
            document.getElementById('menu-desplegable').classList.remove('show');
            renderizarVistas();
        }

        function renderizarVistas() {
            const sem = parseInt(document.getElementById('filtro-semana').value);
            const filtroResp = document.getElementById('filtro-responsable').value;
            document.getElementById('semana-actual').textContent = `SEMANA ${sem}`;

            const contC = document.getElementById('lista-clientes');
            const filtC = clientes.filter(c => getNumeroSemana(new Date(c.fecha_atencion)) === sem);
            if (filtC.length === 0) contC.innerHTML = `<div style="text-align:center; padding:30px; color:var(--texto-secundario); font-size:1.2rem;">No hay programas registrados para esta semana.</div>`;
            else contC.innerHTML = filtC.map(c => {
                let d = new Date(c.fecha_atencion);
                return `<div class="fila-item grid-clientes"><div style="font-weight:bold; color:var(--acento-amarillo);">${d.toLocaleString('en-US', { hour: '2-digit', minute:'2-digit', hour12: true })}</div><div><img src="${c.logo_url}" class="logo-cliente" onerror="this.src='COFTAH.png.png'"></div><div style="font-weight:bold; font-size:1.1rem;">${c.nombre_cliente}</div><div>${c.lugar_atencion}</div><div>${c.curso}</div><div style="font-weight:bold; color:var(--urgencia-baja);">${c.facilitador}</div><div style="font-weight:bold; text-transform:uppercase;">${nombresDias[d.getDay()]}</div><div><span class="badge estatus-${c.estatus}">${c.estatus.toUpperCase()}</span></div></div>`;
            }).join('');

            const contT = document.getElementById('lista-tareas');
            const filtT = tareas.filter(t => {
                let d = parseFechaLocal(t.fecha_limite);
                return getNumeroSemana(d) === sem && (filtroResp === 'TODOS' || t.responsable === filtroResp);
            });

            if (filtT.length === 0) contT.innerHTML = `<div style="text-align:center; padding:30px; color:var(--texto-secundario); font-size:1.2rem;">No hay funciones delegadas.</div>`;
            else {
                contT.innerHTML = '';
                filtT.forEach(t => {
                    let d = parseFechaLocal(t.fecha_limite);
                    
                    // ETIQUETA RESUMIDA EN LA TARJETA PRINCIPAL
                    let infoResp = t.responsable;
                    if (t.tipo_tarea === 'vinculada' && t.nombre_cliente) {
                        let diaPrg = nombresDias[parseFechaLocal(t.fecha_programa).getDay()];
                        let etiqueta = `${t.nombre_cliente} | ${t.curso} (${diaPrg})`;
                        infoResp = `${t.responsable} <br><span style="color:#64FFDA; font-size:0.85rem; font-weight:normal; margin-top:5px; display:inline-block;">Para: ${etiqueta}</span>`;
                    }

                    // EL CLIC AHORA ABRE EL MODAL EN LUGAR DE PREGUNTAR DIRECTAMENTE
                    contT.innerHTML += `<div class="fila-item grid-tareas ${t.completada ? '' : ''}" style="${t.completada ? 'background-color: rgba(46, 139, 87, 0.2);' : ''}" onclick="abrirModal(${t.id})"><div style="font-weight:bold; color:var(--acento-amarillo); font-size:1.1rem;">${infoResp}</div><div style="line-height:1.5; padding-right:20px; font-size:1.05rem;">${t.descripcion}</div><div style="font-weight:bold; text-transform:uppercase;">${nombresDias[d.getDay()]}</div><div style="font-family:monospace; font-size:1.1rem;">${d.toLocaleString('en-US', { hour12:true, hour:'2-digit', minute:'2-digit' })}</div><div>${t.completada ? '--' : 'Pendiente'}</div><div><span class="badge ${t.completada ? 'estatus-completado' : 'estatus-'+t.urgencia}">${t.completada ? 'COMPLETADA' : t.urgencia.toUpperCase()}</span></div></div>`;
                });
            }
        }

        // --- FUNCIONES DEL MODAL INTERACTIVO ---
        function abrirModal(id) {
            const t = tareas.find(x => x.id === id);
            if(!t) return;
            
            let htmlBody = '';

            // SI LA TAREA ESTÁ VINCULADA, MOSTRAMOS TODO EL DESGLOSE DEL CLIENTE
            if (t.tipo_tarea === 'vinculada' && t.nombre_cliente) {
                let dProg = parseFechaLocal(t.fecha_programa);
                htmlBody += `
                    <div class="modal-seccion">
                        <strong>INFORMACIÓN DEL PROGRAMA VINCULADO</strong>
                        <p><b>Cliente / Empresa:</b> ${t.nombre_cliente}</p>
                        <p><b>Curso a dictar:</b> ${t.curso}</p>
                        <p><b>Fecha de Ejecución:</b> ${dProg.toLocaleString('es-ES', { weekday:'long', day:'2-digit', month:'long', hour:'2-digit', minute:'2-digit', hour12:true })}</p>
                        <p><b>Lugar:</b> ${t.lugar_atencion}</p>
                        <p><b>Facilitador a cargo:</b> <span style="color: var(--urgencia-baja); font-weight: bold;">${t.facilitador}</span></p>
                    </div>
                `;
            }

            // LUEGO MOSTRAMOS LA INSTRUCCIÓN DE LA TAREA GIGANTE
            htmlBody += `
                <div class="modal-seccion" style="border-left-color: var(--acento-amarillo);">
                    <strong>MISIÓN ASIGNADA A ${t.responsable.toUpperCase()}</strong>
                    <p style="font-size: 1.25rem; font-weight: 500; margin-top: 10px; color: white;">${t.descripcion}</p>
                </div>
                <div style="display: flex; justify-content: space-between; color: var(--texto-secundario); font-size: 0.95rem;">
                    <span><b>Límite de Entrega:</b> ${parseFechaLocal(t.fecha_limite).toLocaleString('es-ES', { weekday:'long', hour:'2-digit', minute:'2-digit', hour12:true })}</span>
                    <span><b>Nivel de Urgencia:</b> <span style="font-weight: bold;">${t.urgencia.toUpperCase()}</span></span>
                </div>
            `;

            document.getElementById('modal-body').innerHTML = htmlBody;

            // Lógica del botón de completar
            const btn = document.getElementById('btn-completar-modal');
            if(t.completada) {
                btn.style.display = 'none'; // Si ya se hizo, se oculta el botón verde
            } else {
                btn.style.display = 'block';
                btn.onclick = () => marcarCompletadaDesdeModal(t.id, t.responsable);
            }

            document.getElementById('modal-tarea').classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('modal-tarea').classList.remove('active');
        }

        async function marcarCompletadaDesdeModal(id, responsable) {
            const confirmacion = confirm(`¿Confirmas que terminaste la tarea, ${responsable}?`);
            if (!confirmacion) return;

            const tObj = tareas.find(t => t.id === id);
            if (tObj && !tObj.completada) {
                try {
                    await fetch('/api/tareas', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id }) });
                    tObj.completada = true; 
                    hablar(`Excelente trabajo ${tObj.responsable}. Tarea marcada como completada.`); 
                    cerrarModal(); // Cierra la ventana pop-up automáticamente
                    renderizarVistas(); // Actualiza la pantalla para mostrarla en verde
                } catch (error) {
                    console.error("Error marcando completada", error);
                }
            }
        }

        function hablar(texto) { if ('speechSynthesis' in window) { let m = new SpeechSynthesisUtterance(texto); m.lang = 'es-ES'; window.speechSynthesis.speak(m); } }

        function verificarTiempos() {
            const ahora = new Date();
            tareas.forEach(t => {
                if (t.completada || !t.created_at) return; 
                const limite = parseFechaLocal(t.fecha_limite); const inicio = parseFechaLocal(t.created_at); 
                const tiempoRestante = limite.getTime() - ahora.getTime();
                if (tiempoRestante > 0 && tiempoRestante <= ((limite.getTime() - inicio.getTime()) * 0.30) && !tareasAvisadas.has(t.id)) {
                    hablar(`Atención ${t.responsable}. Quedan ${Math.ceil(tiempoRestante / 60000)} minutos para entregar la función.`); tareasAvisadas.add(t.id);
                }
            });
        }

        inicializarFiltrosSemanales(); cargarDatos();
        setInterval(cargarDatos, 15000); setInterval(verificarTiempos, 10000);
    </script>
</body>
</html>
