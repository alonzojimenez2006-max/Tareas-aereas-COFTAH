<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard COFTAH</title>
    <style>
        :root {
            --bg-principal: #0A192F; 
            --bg-paneles: #112240; 
            --texto-principal: #FFFFFF; 
            --texto-secundario: #8892B0; 
            --acento-amarillo: #FFD700; 
            --urgencia-baja: #64FFDA; 
            --urgencia-media: #FFD700; 
            --urgencia-alta: #FF8C00; 
            --urgencia-critica: #FF3366; 
            --completado: #2E8B57; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px; /* Reducido para más espacio */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px; /* Reducido para más espacio */
            padding-bottom: 10px;
            border-bottom: 2px solid var(--bg-paneles);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand img {
            height: 45px;
            width: auto;
        }

        .titulos {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .titulos h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        /* NUEVO: Subtítulo dinámico en amarillo */
        #subtitulo-vista {
            font-size: 1rem;
            color: var(--acento-amarillo);
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-derecha {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .reloj {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--acento-amarillo);
            font-family: monospace;
        }

        /* NUEVO: Contenedor y Botón Hamburguesa */
        .menu-container {
            position: relative;
        }

        .btn-hamburguesa {
            background: none;
            border: none;
            color: var(--texto-principal);
            font-size: 2.2rem;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 0 10px;
        }

        .btn-hamburguesa:hover, .btn-hamburguesa:focus {
            color: var(--acento-amarillo);
            outline: none;
        }

        /* NUEVO: Menú desplegable */
        .menu-desplegable {
            display: none; 
            position: absolute;
            top: 110%;
            right: 0;
            background-color: var(--bg-paneles);
            border: 1px solid var(--texto-secundario);
            border-radius: 8px;
            padding: 15px;
            z-index: 1000;
            min-width: 260px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            flex-direction: column;
            gap: 10px;
        }

        .menu-desplegable.show {
            display: flex;
        }

        .menu-item {
            background-color: transparent;
            color: var(--texto-secundario);
            border: none;
            padding: 12px;
            text-align: left;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 5px;
            text-transform: uppercase;
        }

        .menu-item:hover {
            background-color: rgba(255, 215, 0, 0.1);
            color: var(--texto-principal);
        }

        .menu-item.active {
            background-color: rgba(255, 215, 0, 0.15);
            color: var(--acento-amarillo);
            border-left: 4px solid var(--acento-amarillo);
        }

        .dropdown-dias {
            display: none; /* Oculto por defecto, se muestra en JS */
            width: 100%;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            border: 1px solid var(--texto-secundario);
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            outline: none;
            margin-top: 5px;
        }

        .dropdown-dias:focus {
            border-color: var(--acento-amarillo);
        }

        .vista {
            display: none; 
            background-color: var(--bg-paneles);
            flex: 1;
            border-radius: 12px;
            padding: 20px;
            flex-direction: column;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .vista.active {
            display: flex; 
        }

        .fila-header, .fila-item {
            display: grid;
            gap: 15px;
            align-items: center;
            padding: 12px 15px;
            border-radius: 8px;
        }

        .grid-clientes { grid-template-columns: 140px 50px 2fr 1fr 2fr 1fr 120px; }
        .grid-tareas { grid-template-columns: 1fr 4fr 150px 150px 120px; }

        .fila-header {
            font-size: 0.9rem;
            color: var(--texto-secundario);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 10px;
        }

        .fila-item {
            background-color: rgba(255, 255, 255, 0.03);
            margin-bottom: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .fila-item:hover {
            background-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .logo-cliente {
            width: 35px;
            height: 35px;
            background-color: white;
            border-radius: 50%;
            object-fit: contain;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            display: inline-block;
            width: 100%;
        }

        .estatus-rutina { background-color: var(--urgencia-baja); color: #000; }
        .estatus-importante { background-color: var(--urgencia-media); color: #000; }
        .estatus-urgente { background-color: var(--urgencia-alta); color: #fff; }
        .estatus-critica { background-color: var(--urgencia-critica); color: #fff; animation: parpadeo 1.5s infinite; }
        .estatus-completado { background-color: var(--completado); color: #fff; }
        .estatus-programado { background-color: var(--urgencia-baja); color: #000; }
        .estatus-retrasado { background-color: var(--urgencia-critica); color: #fff; }

        @keyframes destelloVerde {
            0% { background-color: rgba(255, 255, 255, 0.03); transform: scale(1); }
            50% { background-color: var(--completado); transform: scale(1.01); }
            100% { background-color: rgba(46, 139, 87, 0.2); transform: scale(1); }
        }
        .animacion-completado { animation: destelloVerde 1.5s ease-out forwards; }
        @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .contenedor-lista {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-paneles); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--acento-amarillo); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="COFTAH.png.png" alt="Logo de COFTAH">
            <div class="titulos">
                <h1>COFTAH / TABLERO DE OPERACIONES</h1>
                <div id="subtitulo-vista">CRONOGRAMA DE CLIENTES</div>
            </div>
        </div>
        
        <div class="header-derecha">
            <div class="reloj" id="reloj-digital">00:00:00</div>
            
            <div class="menu-container">
                <button id="btn-menu" class="btn-hamburguesa" onclick="toggleMenu()">&#9776;</button>
                
                <div id="menu-desplegable" class="menu-desplegable">
                    <button class="menu-item active" id="btn-clientes" onclick="cambiarVista('clientes')">Cronograma de Clientes</button>
                    <button class="menu-item" id="btn-tareas" onclick="cambiarVista('tareas')">Delegación de Funciones</button>
                    
                    <!-- El select de días ahora vive dentro del menú -->
                    <select id="filtro-dias" class="dropdown-dias" onchange="renderizarTareas()">
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Se eliminó el div <div class="controles-superiores"> para ahorrar espacio -->

    <!-- Vista 1: Clientes -->
    <div class="vista active" id="vista-clientes">
        <div class="fila-header grid-clientes">
            <div>Fecha/Hora</div>
            <div>Logo</div>
            <div>Cliente</div>
            <div>Lugar</div>
            <div>Curso al detal</div>
            <div>Facilitador</div>
            <div>Estatus</div>
        </div>
        <div class="contenedor-lista" id="lista-clientes"></div>
    </div>

    <!-- Vista 2: Tareas -->
    <div class="vista" id="vista-tareas">
        <div class="fila-header grid-tareas">
            <div>Responsable</div>
            <div>Tarea Asignada</div>
            <div>Hora Límite</div>
            <div>Tiempo Restante</div>
            <div>Estatus</div>
        </div>
        <div class="contenedor-lista" id="lista-tareas"></div>
    </div>

    <script>
        // Reloj en tiempo real
        setInterval(() => {
            const ahora = new Date();
            document.getElementById('reloj-digital').textContent = ahora.toLocaleTimeString('en-US', { hour12: true });
        }, 1000);

        // Funciones del Menú Hamburguesa
        function toggleMenu() {
            document.getElementById('menu-desplegable').classList.toggle('show');
        }

        // Cerrar el menú si se hace clic fuera de él
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('menu-desplegable');
            const boton = document.getElementById('btn-menu');
            if (!menu.contains(event.target) && event.target !== boton) {
                menu.classList.remove('show');
            }
        });

        let clientes = [];
        let tareas = [];
        
        // Memorias para la voz automática (Se mantiene el código intacto)
        let tareasAvisadas30 = new Set(); 
        let clientesConocidos = new Set(); 
        let tareasConocidas = new Set();   
        let esPrimeraCarga = true;         

        async function cargarDatos() {
            try {
                const resClientes = await fetch('/api/clientes');
                clientes = await resClientes.json();
                
                const resTareas = await fetch('/api/tareas');
                const tareasDB = await resTareas.json();
                
                tareas = tareasDB.map(t => {
                    const fechaObj = new Date(t.fecha_limite);
                    return {
                        ...t,
                        fechaAsignada: fechaObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }),
                        horaLimite: fechaObj.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit' })
                    };
                });

                if (esPrimeraCarga) {
                    clientes.forEach(c => clientesConocidos.add(c.id));
                    tareas.forEach(t => tareasConocidas.add(t.id));
                    esPrimeraCarga = false;
                } else {
                    clientes.forEach(c => {
                        if (!clientesConocidos.has(c.id)) {
                            hablar(`Atención equipo. Nuevo programa registrado: ${c.nombre_cliente}. Curso de ${c.curso}.`);
                            clientesConocidos.add(c.id);
                        }
                    });

                    tareas.forEach(t => {
                        if (!tareasConocidas.has(t.id)) {
                            let msjNuevaTarea = t.nombre_cliente 
                                ? `Atención. Nueva función delegada a ${t.responsable} para el cliente ${t.nombre_cliente}. Tarea: ${t.descripcion}.`
                                : `Atención. Nueva función delegada a ${t.responsable}. Tarea: ${t.descripcion}.`;
                            hablar(msjNuevaTarea);
                            tareasConocidas.add(t.id);
                        }
                    });
                }

                inicializarFiltroFechas();
                renderizarClientes();
                
                if(document.getElementById('vista-tareas').classList.contains('active')) {
                    renderizarTareas();
                }
            } catch (error) {
                console.error("Error conectando con la base de datos:", error);
            }
        }

        function inicializarFiltroFechas() {
            const selectDias = document.getElementById('filtro-dias');
            const valorActual = selectDias.value; 
            const fechasUnicas = [...new Set(tareas.map(t => t.fechaAsignada))];
            
            selectDias.innerHTML = fechasUnicas.map(fecha => 
                `<option value="${fecha}">${fecha}</option>`
            ).join('');
            
            if(fechasUnicas.includes(valorActual)) selectDias.value = valorActual;
        }

        function cambiarVista(vistaId) {
            // Quitar clase active de todo
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
            
            // Activar la vista seleccionada
            document.getElementById(`vista-${vistaId}`).classList.add('active');
            document.getElementById(`btn-${vistaId}`).classList.add('active');

            // Configurar el subtítulo y el selector de fechas
            const subtitulo = document.getElementById('subtitulo-vista');
            const selectDias = document.getElementById('filtro-dias');

            if (vistaId === 'tareas') {
                subtitulo.textContent = 'DELEGACIÓN DE FUNCIONES';
                selectDias.style.display = 'block'; // Muestra el selector dentro del menú
                renderizarTareas(); 
            } else {
                subtitulo.textContent = 'CRONOGRAMA DE CLIENTES';
                selectDias.style.display = 'none'; // Oculta el selector
            }

            // Ocultar el menú automáticamente después de elegir
            document.getElementById('menu-desplegable').classList.remove('show');
        }

        function renderizarClientes() {
            const contenedor = document.getElementById('lista-clientes');
            contenedor.innerHTML = clientes.map(c => {
                const fechaFormat = new Date(c.fecha_atencion).toLocaleString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit', hour12: true });
                return `
                <div class="fila-item grid-clientes">
                    <div style="font-weight: bold; color: var(--acento-amarillo);">${fechaFormat}</div>
                    <div><img src="${c.logo_url}" class="logo-cliente" onerror="this.src='COFTAH.png.png'" alt="Logo"></div>
                    <div style="font-weight: bold;">${c.nombre_cliente}</div>
                    <div>${c.lugar_atencion}</div>
                    <div>${c.curso}</div>
                    <div>${c.facilitador}</div>
                    <div><span class="badge estatus-${c.estatus}">${c.estatus.toUpperCase()}</span></div>
                </div>
            `}).join('');
        }

        function renderizarTareas(idAnimar = null) {
            const contenedor = document.getElementById('lista-tareas');
            const fechaSeleccionada = document.getElementById('filtro-dias').value;
            contenedor.innerHTML = ''; 

            const tareasDelDia = tareas.filter(t => t.fechaAsignada === fechaSeleccionada);
            
            if (tareasDelDia.length === 0) {
                contenedor.innerHTML = `<div style="text-align: center; padding: 20px; color: var(--texto-secundario);">No hay tareas asignadas para este día.</div>`;
                return;
            }

            tareasDelDia.forEach(t => {
                let badgeClass = t.completada ? "estatus-completado" : `estatus-${t.urgencia}`;
                let badgeText = t.completada ? "COMPLETADA" : t.urgencia.toUpperCase();
                let filaClase = t.id === idAnimar ? "animacion-completado" : "";
                let estiloFila = t.completada && t.id !== idAnimar ? "background-color: rgba(46, 139, 87, 0.2);" : "";

                let infoResponsable = t.responsable;
                if (t.tipo_tarea === 'vinculada' && t.nombre_cliente) {
                    infoResponsable = `${t.responsable} <br><span style="color: #64FFDA; font-size: 0.85rem; font-weight: normal; margin-top: 5px; display: inline-block;">Para: ${t.nombre_cliente}</span>`;
                }

                contenedor.innerHTML += `
                    <div class="fila-item grid-tareas ${filaClase}" style="${estiloFila}" onclick="marcarCompletada(${t.id}, '${t.responsable}')">
                        <div style="font-weight: bold; color: var(--acento-amarillo); font-size: 1.1rem;">${infoResponsable}</div>
                        <div style="line-height: 1.5; padding-right: 20px; font-size: 1.05rem;">${t.descripcion}</div>
                        <div style="font-family: monospace; font-size: 1.1rem;">${t.horaLimite}</div>
                        <div>${t.completada ? '--' : 'Pendiente'}</div>
                        <div><span class="badge ${badgeClass}">${badgeText}</span></div>
                    </div>
                `;
            });
        }

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                const mensaje = new SpeechSynthesisUtterance(texto);
                mensaje.lang = 'es-ES';
                window.speechSynthesis.speak(mensaje);
            }
        }

        function verificarTiempos() {
            const ahora = new Date();
            
            tareas.forEach(t => {
                if (t.completada || !t.created_at) return; 

                const limite = new Date(t.fecha_limite);
                const inicio = new Date(t.created_at); 

                const tiempoTotal = limite.getTime() - inicio.getTime();
                const tiempoRestante = limite.getTime() - ahora.getTime();

                if (tiempoRestante > 0 && tiempoRestante <= (tiempoTotal * 0.30)) {
                    if (!tareasAvisadas30.has(t.id)) {
                        const minRestantes = Math.ceil(tiempoRestante / 60000);
                        let txtMinutos = minRestantes === 1 ? '1 minuto' : `${minRestantes} minutos`;
                        
                        let mensajePresion = t.nombre_cliente 
                            ? `Atención ${t.responsable}. El tiempo se agota. Quedan ${txtMinutos} para entregar la función del cliente ${t.nombre_cliente}: ${t.descripcion}`
                            : `Atención ${t.responsable}. El tiempo se agota. Quedan ${txtMinutos} para entregar la función: ${t.descripcion}`;
                        
                        hablar(mensajePresion);
                        tareasAvisadas30.add(t.id);
                    }
                }
            });
        }

        async function marcarCompletada(id, responsable) {
            const confirmacion = confirm(`¿Confirmas que la función asignada a ${responsable} fue realizada exitosamente?`);
            if (!confirmacion) return; 

            const tareaObj = tareas.find(t => t.id === id);
            if (tareaObj && !tareaObj.completada) {
                try {
                    await fetch('/api/tareas', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: id })
                    });
                    
                    tareaObj.completada = true;
                    
                    let mensajeExito = tareaObj.nombre_cliente
                        ? `${tareaObj.responsable} completó la tarea para el cliente ${tareaObj.nombre_cliente}. Tarea finalizada: ${tareaObj.descripcion}.`
                        : `${tareaObj.responsable} completó la tarea. Tarea finalizada: ${tareaObj.descripcion}.`;
                    
                    hablar(mensajeExito);
                    renderizarTareas(id); 
                } catch (error) {
                    console.error("Error al completar la tarea:", error);
                }
            }
        }

        cargarDatos();
        setInterval(cargarDatos, 15000);       
        setInterval(verificarTiempos, 10000);  
        
    </script>
</body>
</html>
