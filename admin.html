<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dashboard COFTAH</title>
    <style>
        :root {
            --bg-principal: #0A192F; 
            --bg-paneles: #112240; 
            --texto-principal: #FFFFFF; 
            --texto-secundario: #8892B0; 
            --acento-amarillo: #FFD700; 
            --input-bg: #1A365D;
            --borde-input: #234E8A;
            --btn-borrar: #FF3366;
            --completado: #2E8B57;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg-paneles);
        }

        header img {
            height: 45px;
            width: auto;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--acento-amarillo);
            letter-spacing: 1px;
        }

        .tabs-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--bg-paneles);
            color: var(--texto-secundario);
            border: 2px solid transparent;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .tab-btn:hover {
            color: var(--texto-principal);
            background-color: rgba(255, 215, 0, 0.1);
        }

        .tab-btn.active {
            background-color: rgba(255, 215, 0, 0.15);
            color: var(--acento-amarillo);
            border: 2px solid var(--acento-amarillo);
        }

        .vista {
            display: none; 
            background-color: var(--bg-paneles);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            max-width: 900px;
            margin: 0 auto;
        }

        .vista.active {
            display: block; 
        }

        .panel-titulo {
            font-size: 1.3rem;
            text-transform: uppercase;
            color: var(--acento-amarillo);
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 20px; }
        .row-group { display: flex; gap: 15px; margin-bottom: 20px; }
        .row-group > div { flex: 1; }
        
        label { display: block; margin-bottom: 8px; color: var(--texto-secundario); font-weight: bold; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--borde-input);
            border-radius: 6px;
            color: var(--texto-principal);
            font-size: 1rem;
            outline: none;
        }

        input[type="file"] { padding: 9px; cursor: pointer; }
        
        input[type="file"]::file-selector-button {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            border: 1px solid var(--acento-amarillo);
            padding: 8px 16px;
            border-radius: 4px;
            margin-right: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: var(--acento-amarillo);
            color: #000;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--acento-amarillo);
        }

        .radio-group { display: flex; gap: 20px; background-color: var(--input-bg); padding: 12px; border-radius: 6px; }

        .tabla-gestion {
            width: 100%; border-collapse: collapse; margin-bottom: 30px;
            background-color: var(--input-bg); border-radius: 8px; overflow: hidden;
        }

        .tabla-gestion th, .tabla-gestion td {
            padding: 12px; text-align: left; border-bottom: 1px solid var(--borde-input);
        }

        .tabla-gestion th { background-color: var(--bg-principal); color: var(--acento-amarillo); text-transform: uppercase; font-size: 0.9rem; }

        .btn-accion { padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        .btn-borrar { background-color: var(--btn-borrar); }
        .btn-borrar:hover { background-color: #d12650; }

        .btn-submit {
            width: 100%; padding: 15px; background-color: var(--acento-amarillo); color: #000;
            border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }
        .btn-submit.success { background-color: var(--completado); color: white; }
        .btn-submit:disabled { background-color: #8892B0; cursor: not-allowed; }

        #grupo-programa-vinculado { display: none; }
    </style>
</head>
<body>

    <header>
        <img src="COFTAH.png.png" alt="Logo de COFTAH">
        <h1>PANEL DE ADMINISTRACIÓN</h1>
    </header>

    <div class="tabs-container">
        <button class="tab-btn active" id="btn-clientes" onclick="cambiarFormulario('clientes')">Programar Cliente</button>
        <button class="tab-btn" id="btn-tareas" onclick="cambiarFormulario('tareas')">Delegar Función</button>
        <button class="tab-btn" id="btn-personal" onclick="cambiarFormulario('personal')">Gestionar Equipo</button>
        <button class="tab-btn" id="btn-gestion" onclick="cambiarFormulario('gestion'); cargarDatosGestion();">Gestión General</button>
    </div>

    <!-- VISTA 1: CLIENTES -->
    <div class="vista active" id="vista-clientes">
        <h2 class="panel-titulo">Datos del Cliente</h2>
        <form id="form-cliente">
            <div class="row-group">
                <div>
                    <label>Semana</label>
                    <select id="semana-cliente" required></select>
                </div>
                <div>
                    <label>Día</label>
                    <select id="dia-cliente" required>
                        <option value="1">Lunes</option>
                        <option value="2">Martes</option>
                        <option value="3">Miércoles</option>
                        <option value="4">Jueves</option>
                        <option value="5">Viernes</option>
                        <option value="6">Sábado</option>
                        <option value="7">Domingo</option>
                    </select>
                </div>
                <div>
                    <label>Hora</label>
                    <input type="time" id="hora-cliente" required>
                </div>
            </div>
            
            <div class="form-group">
                <!-- Se quitó el "required" -->
                <label for="logo-cliente">Logo de la Empresa (Opcional)</label>
                <input type="file" id="logo-cliente" accept="image/png, image/jpeg">
            </div>

            <div class="form-group">
                <label for="nombre-cliente">Nombre del Cliente / Empresa</label>
                <input type="text" id="nombre-cliente" required>
            </div>
            <div class="form-group">
                <label for="lugar-cliente">Lugar de Atención</label>
                <input type="text" id="lugar-cliente" required>
            </div>
            <div class="form-group">
                <label for="curso-cliente">Curso al detal</label>
                <input type="text" id="curso-cliente" required>
            </div>
            <div class="form-group">
                <label for="facilitador-cliente">Facilitador Asignado</label>
                <select id="facilitador-cliente" required>
                    <option value="" disabled selected>Cargando personal...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="estatus-cliente">Estatus Inicial</label>
                <select id="estatus-cliente" required>
                    <option value="programado" selected>Programado</option>
                    <option value="importante">Aviso Próximo</option>
                    <option value="retrasado">Retrasado</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Guardar Cliente</button>
        </form>
    </div>

    <!-- VISTA 2: TAREAS -->
    <div class="vista" id="vista-tareas">
        <h2 class="panel-titulo">Asignación de Tareas</h2>
        <form id="form-tarea">
            <div class="form-group">
                <label>Tipo de Función a Delegar</label>
                <div class="radio-group">
                    <label><input type="radio" name="tipo-tarea" value="aislada" checked> Aislada</label>
                    <label><input type="radio" name="tipo-tarea" value="vinculada"> Vincular a Programa</label>
                </div>
            </div>
            <div class="form-group" id="grupo-programa-vinculado">
                <label for="programa-vinculado">Seleccionar Programa Activo</label>
                <select id="programa-vinculado"></select>
            </div>
            <div class="form-group">
                <label for="responsable-tarea">Responsable</label>
                <select id="responsable-tarea" required>
                    <option value="" disabled selected>Cargando personal...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="descripcion-tarea">Descripción de la Tarea</label>
                <textarea id="descripcion-tarea" required></textarea>
            </div>
            
            <!-- Selector Semanal para Tareas -->
            <div class="row-group">
                <div>
                    <label>Semana Límite</label>
                    <select id="semana-tarea" required></select>
                </div>
                <div>
                    <label>Día Límite</label>
                    <select id="dia-tarea" required>
                        <option value="1">Lunes</option>
                        <option value="2">Martes</option>
                        <option value="3">Miércoles</option>
                        <option value="4">Jueves</option>
                        <option value="5">Viernes</option>
                        <option value="6">Sábado</option>
                        <option value="7">Domingo</option>
                    </select>
                </div>
                <div>
                    <label>Hora Límite</label>
                    <input type="time" id="hora-tarea" required>
                </div>
            </div>

            <div class="form-group">
                <label for="urgencia-tarea">Nivel de Urgencia</label>
                <select id="urgencia-tarea" required>
                    <option value="rutina">Rutina</option>
                    <option value="importante">Importante</option>
                    <option value="urgente">Urgente</option>
                    <option value="critica">Crítica</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Delegar Función</button>
        </form>
    </div>

    <!-- VISTA 3: PERSONAL (NUEVA) -->
    <div class="vista" id="vista-personal">
        <h2 class="panel-titulo">Registrar Miembro del Equipo</h2>
        <form id="form-personal">
            <div class="form-group">
                <label>Nombre de la Persona (o Apodo)</label>
                <input type="text" id="nombre-personal" placeholder="Ej: TT, Alonzo, Jh..." required>
            </div>
            <div class="form-group">
                <label>Rol</label>
                <select id="rol-personal" required>
                    <option value="facilitador">Facilitador (Cursos/Clientes)</option>
                    <option value="responsable">Responsable (Delegación de Tareas)</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Añadir al Equipo</button>
        </form>
    </div>

    <!-- VISTA 4: GESTIÓN DE REGISTROS -->
    <div class="vista" id="vista-gestion">
        <h2 class="panel-titulo">Programas Activos (Clientes)</h2>
        <table class="tabla-gestion">
            <thead><tr><th>Fecha</th><th>Cliente</th><th>Curso</th><th>Acción</th></tr></thead>
            <tbody id="tbody-clientes"><tr><td colspan="4">Cargando...</td></tr></tbody>
        </table>

        <h2 class="panel-titulo">Funciones Delegadas</h2>
        <table class="tabla-gestion">
            <thead><tr><th>Responsable</th><th>Descripción</th><th>Estatus</th><th>Acción</th></tr></thead>
            <tbody id="tbody-tareas"><tr><td colspan="4">Cargando...</td></tr></tbody>
        </table>
    </div>

    <script>
        function cambiarFormulario(vistaId) {
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`vista-${vistaId}`).classList.add('active');
            document.getElementById(`btn-${vistaId}`).classList.add('active');
        }

        // LÓGICA DE SEMANAS
        function llenarSemanas() {
            const selects = [document.getElementById('semana-cliente'), document.getElementById('semana-tarea')];
            let hoy = new Date();
            let diaSemana = hoy.getDay() || 7; 
            let lunesActual = new Date(hoy);
            lunesActual.setDate(hoy.getDate() - diaSemana + 1);
            lunesActual.setHours(0,0,0,0);

            selects.forEach(select => select.innerHTML = '');

            for (let i = 0; i < 12; i++) {
                let lunesSemana = new Date(lunesActual.getTime() + (i * 7 * 24 * 60 * 60 * 1000));
                
                // Calcular N° de semana ISO básico
                let d = new Date(Date.UTC(lunesSemana.getFullYear(), lunesSemana.getMonth(), lunesSemana.getDate()));
                d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
                let yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
                let numSemana = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);

                let fechaStr = lunesSemana.toISOString().split('T')[0];
                let label = `Semana ${numSemana} (Inicio: ${lunesSemana.toLocaleDateString('es-ES', {day:'2-digit', month:'short'})})`;
                
                selects.forEach(select => select.add(new Option(label, fechaStr)));
            }
        }

        // Función para transformar Semana + Día + Hora a formato para la BD
        function construirFecha(idSemana, idDia, idHora) {
            let fechaBase = new Date(document.getElementById(idSemana).value + "T00:00:00"); 
            let diasSumar = parseInt(document.getElementById(idDia).value) - 1;
            fechaBase.setDate(fechaBase.getDate() + diasSumar);
            
            let hora = document.getElementById(idHora).value; 
            if(!hora) hora = "00:00";
            let [hh, mm] = hora.split(':');
            fechaBase.setHours(hh, mm, 0, 0);
            
            // Ajustar para evitar problemas de zona horaria al guardar
            let tzoffset = (new Date()).getTimezoneOffset() * 60000;
            return (new Date(fechaBase - tzoffset)).toISOString().slice(0, 16);
        }

        // LÓGICA DE PERSONAL
        async function cargarPersonal() {
            try {
                const res = await fetch('/api/personal');
                if(!res.ok) return;
                const personal = await res.json();
                
                const selFacilitador = document.getElementById('facilitador-cliente');
                const selResponsable = document.getElementById('responsable-tarea');
                
                selFacilitador.innerHTML = '<option value="" disabled selected>Seleccione facilitador...</option>';
                selResponsable.innerHTML = '<option value="" disabled selected>Seleccione responsable...</option>';

                personal.forEach(p => {
                    // Usamos el nombre como valor para no romper tu base de datos actual
                    if(p.rol === 'facilitador') selFacilitador.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`;
                    if(p.rol === 'responsable') selResponsable.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`;
                });
            } catch (error) {
                console.error("Error cargando personal");
            }
        }

        document.getElementById('form-personal').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            btn.textContent = "Registrando..."; btn.disabled = true;

            const datos = {
                nombre: document.getElementById('nombre-personal').value,
                rol: document.getElementById('rol-personal').value
            };

            try {
                const res = await fetch('/api/personal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                
                const data = await res.json();
                if (res.ok) {
                    alert("✅ Persona registrada.");
                    this.reset();
                    cargarPersonal(); // Actualiza los selects automáticamente
                } else {
                    alert(data.error || "Error al registrar.");
                }
            } catch (error) {
                alert("Error de red.");
            } finally {
                btn.textContent = "Añadir al Equipo"; btn.disabled = false;
            }
        });

        // LÓGICA DE VINCULACIÓN
        const radiosTipoTarea = document.querySelectorAll('input[name="tipo-tarea"]');
        const grupoPrograma = document.getElementById('grupo-programa-vinculado');
        const selectPrograma = document.getElementById('programa-vinculado');

        radiosTipoTarea.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'vinculada') {
                    grupoPrograma.style.display = 'block'; selectPrograma.required = true;
                } else {
                    grupoPrograma.style.display = 'none'; selectPrograma.required = false;
                }
            });
        });

        async function cargarProgramasDropdown() {
            try {
                const res = await fetch('/api/clientes');
                const clientes = await res.json();
                selectPrograma.innerHTML = '<option value="" disabled selected>Selecciona un programa...</option>';
                clientes.forEach(c => {
                    const fechaStr = new Date(c.fecha_atencion).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
                    selectPrograma.innerHTML += `<option value="${c.id}">${fechaStr} - ${c.nombre_cliente}</option>`;
                });
            } catch (error) {}
        }

        // GUARDADO DE CLIENTES
        document.getElementById('form-cliente').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            btn.textContent = "Guardando..."; btn.disabled = true;

            // Procesar la fecha con el planificador semanal
            const fechaExacta = construirFecha('semana-cliente', 'dia-cliente', 'hora-cliente');

            const nuevoCliente = {
                fecha_atencion: fechaExacta,
                logo_url: "", // Si quieres subir archivos reales, necesitarías FormData. Por ahora lo dejamos vacío para que el backend ponga el por defecto.
                nombre_cliente: document.getElementById('nombre-cliente').value,
                lugar_atencion: document.getElementById('lugar-cliente').value,
                curso: document.getElementById('curso-cliente').value,
                facilitador: document.getElementById('facilitador-cliente').value,
                estatus: document.getElementById('estatus-cliente').value
            };

            try {
                const res = await fetch('/api/clientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoCliente)
                });
                
                const data = await res.json();
                if (res.ok) {
                    alert("✅ Cliente guardado.");
                    this.reset();
                    cargarProgramasDropdown();
                } else {
                    alert(data.error || "⚠️ Error al guardar el cliente.");
                }
            } catch (error) {
                alert("⚠️ Error de conexión.");
            } finally {
                btn.textContent = "Guardar Cliente"; btn.disabled = false;
            }
        });

        // GUARDADO DE TAREAS
        document.getElementById('form-tarea').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            btn.textContent = "Delegando..."; btn.disabled = true;

            const tipoTarea = document.querySelector('input[name="tipo-tarea"]:checked').value;
            const fechaExacta = construirFecha('semana-tarea', 'dia-tarea', 'hora-tarea');

            const nuevaTarea = {
                tipo_tarea: tipoTarea,
                programa_id: tipoTarea === 'vinculada' ? selectPrograma.value : null,
                responsable: document.getElementById('responsable-tarea').value,
                descripcion: document.getElementById('descripcion-tarea').value,
                fecha_limite: fechaExacta,
                urgencia: document.getElementById('urgencia-tarea').value
            };

            try {
                const res = await fetch('/api/tareas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevaTarea)
                });

                if (res.ok) {
                    alert("✅ Función delegada.");
                    this.reset();
                } else {
                    alert("⚠️ Error al delegar la función.");
                }
            } catch (error) {
                alert("⚠️ Error de conexión.");
            } finally {
                btn.textContent = "Delegar Función"; btn.disabled = false;
            }
        });

        // LÓGICA DE GESTIÓN Y BORRADO (Igual que antes)
        async function cargarDatosGestion() {
            try {
                const resC = await fetch('/api/clientes');
                const clientes = await resC.json();
                const tbC = document.getElementById('tbody-clientes');
                tbC.innerHTML = '';
                if(clientes.length === 0) tbC.innerHTML = '<tr><td colspan="4">Sin clientes</td></tr>';
                clientes.forEach(c => {
                    tbC.innerHTML += `<tr><td>${new Date(c.fecha_atencion).toLocaleDateString()}</td><td>${c.nombre_cliente}</td><td>${c.curso}</td><td><button class="btn-accion btn-borrar" onclick="borrarRegistro('clientes', ${c.id})">Borrar</button></td></tr>`;
                });

                const resT = await fetch('/api/tareas');
                const tareas = await resT.json();
                const tbT = document.getElementById('tbody-tareas');
                tbT.innerHTML = '';
                if(tareas.length === 0) tbT.innerHTML = '<tr><td colspan="4">Sin tareas</td></tr>';
                tareas.forEach(t => {
                    tbT.innerHTML += `<tr><td>${t.responsable}</td><td>${t.descripcion.substring(0, 30)}...</td><td>${t.completada ? 'Completada' : 'Pendiente'}</td><td><button class="btn-accion btn-borrar" onclick="borrarRegistro('tareas', ${t.id})">Borrar</button></td></tr>`;
                });
            } catch (error) {}
        }

        async function borrarRegistro(tipo, id) {
            if(confirm('¿Eliminar este registro?')) {
                try {
                    const res = await fetch(`/api/${tipo}`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: id })
                    });
                    if(res.ok) { alert("Eliminado."); cargarDatosGestion(); cargarProgramasDropdown(); }
                } catch (error) {}
            }
        }

        // Inicializar
        llenarSemanas();
        cargarPersonal();
        cargarProgramasDropdown();
    </script>
</body>
</html>
