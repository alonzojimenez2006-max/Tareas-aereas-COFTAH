<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dashboard COFTAH</title>
    <style>
        :root {
            --bg-principal: #0A192F; 
            --bg-paneles: #112240; 
            --texto-principal: #FFFFFF; 
            --texto-secundario: #8892B0; 
            --acento-amarillo: #FFD700; 
            --input-bg: #1A365D;
            --borde-input: #234E8A;
            --btn-borrar: #FF3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg-paneles);
        }

        header img {
            height: 45px;
            width: auto;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--acento-amarillo);
            letter-spacing: 1px;
        }

        .tabs-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--bg-paneles);
            color: var(--texto-secundario);
            border: 2px solid transparent;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .tab-btn:hover {
            color: var(--texto-principal);
            background-color: rgba(255, 215, 0, 0.1);
        }

        .tab-btn.active {
            background-color: rgba(255, 215, 0, 0.15);
            color: var(--acento-amarillo);
            border: 2px solid var(--acento-amarillo);
        }

        .vista {
            display: none; 
            background-color: var(--bg-paneles);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            max-width: 900px;
            margin: 0 auto;
        }

        .vista.active {
            display: block; 
        }

        .panel-titulo {
            font-size: 1.3rem;
            text-transform: uppercase;
            color: var(--acento-amarillo);
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--texto-secundario); font-weight: bold; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--borde-input);
            border-radius: 6px;
            color: var(--texto-principal);
            font-size: 1rem;
            outline: none;
        }

        input[type="file"] {
            padding: 9px;
            cursor: pointer;
        }
        
        input[type="file"]::file-selector-button {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            border: 1px solid var(--acento-amarillo);
            padding: 8px 16px;
            border-radius: 4px;
            margin-right: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: var(--acento-amarillo);
            color: #000;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--acento-amarillo);
        }

        .radio-group {
            display: flex; gap: 20px; background-color: var(--input-bg); padding: 12px; border-radius: 6px;
        }

        .tabla-gestion {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            background-color: var(--input-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        .tabla-gestion th, .tabla-gestion td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--borde-input);
        }

        .tabla-gestion th {
            background-color: var(--bg-principal);
            color: var(--acento-amarillo);
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn-accion {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-borrar { background-color: var(--btn-borrar); }
        .btn-borrar:hover { background-color: #d12650; }

        .btn-submit {
            width: 100%; padding: 15px; background-color: var(--acento-amarillo); color: #000;
            border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }

        .btn-submit:disabled {
            background-color: #8892B0;
            cursor: not-allowed;
        }

        #grupo-programa-vinculado { display: none; }
    </style>
</head>
<body>

    <header>
        <img src="COFTAH.png.png" alt="Logo de COFTAH">
        <h1>PANEL DE ADMINISTRACIÓN</h1>
    </header>

    <div class="tabs-container">
        <button class="tab-btn active" id="btn-clientes" onclick="cambiarFormulario('clientes')">Programar Cliente</button>
        <button class="tab-btn" id="btn-tareas" onclick="cambiarFormulario('tareas')">Delegar Función</button>
        <button class="tab-btn" id="btn-gestion" onclick="cambiarFormulario('gestion'); cargarDatosGestion();">Gestionar Registros</button>
    </div>

    <!-- VISTA 1: CLIENTES -->
    <div class="vista active" id="vista-clientes">
        <h2 class="panel-titulo">Datos del Cliente</h2>
        <form id="form-cliente">
            <div class="form-group">
                <label for="fecha-cliente">Fecha y Hora de Atención</label>
                <input type="datetime-local" id="fecha-cliente" required>
            </div>
            
            <!-- RECUPERADO: Campo para el logo -->
            <div class="form-group">
                <label for="logo-cliente">Logo de la Empresa (Formato PNG/JPG)</label>
                <input type="file" id="logo-cliente" accept="image/png, image/jpeg" required>
            </div>

            <div class="form-group">
                <label for="nombre-cliente">Nombre del Cliente / Empresa</label>
                <input type="text" id="nombre-cliente" required>
            </div>
            <div class="form-group">
                <label for="lugar-cliente">Lugar de Atención</label>
                <input type="text" id="lugar-cliente" required>
            </div>
            <div class="form-group">
                <label for="curso-cliente">Curso al detal</label>
                <input type="text" id="curso-cliente" required>
            </div>
            <div class="form-group">
                <label for="facilitador-cliente">Facilitador Asignado</label>
                <input type="text" id="facilitador-cliente" required>
            </div>
            <div class="form-group">
                <label for="estatus-cliente">Estatus Inicial</label>
                <select id="estatus-cliente" required>
                    <option value="programado" selected>Programado</option>
                    <option value="importante">Aviso Próximo</option>
                    <option value="retrasado">Retrasado</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Guardar Cliente</button>
        </form>
    </div>

    <!-- VISTA 2: TAREAS -->
    <div class="vista" id="vista-tareas">
        <h2 class="panel-titulo">Asignación de Tareas</h2>
        <form id="form-tarea">
            <div class="form-group">
                <label>Tipo de Función a Delegar</label>
                <div class="radio-group">
                    <label><input type="radio" name="tipo-tarea" value="aislada" checked> Aislada</label>
                    <label><input type="radio" name="tipo-tarea" value="vinculada"> Vincular a Programa</label>
                </div>
            </div>
            <div class="form-group" id="grupo-programa-vinculado">
                <label for="programa-vinculado">Seleccionar Programa Activo</label>
                <select id="programa-vinculado"></select>
            </div>
            <div class="form-group">
                <label for="responsable-tarea">Responsable</label>
                <input type="text" id="responsable-tarea" required>
            </div>
            <div class="form-group">
                <label for="descripcion-tarea">Descripción de la Tarea</label>
                <textarea id="descripcion-tarea" required></textarea>
            </div>
            <div class="form-group">
                <label for="fecha-tarea">Fecha y Hora Límite</label>
                <input type="datetime-local" id="fecha-tarea" required>
            </div>
            <div class="form-group">
                <label for="urgencia-tarea">Nivel de Urgencia</label>
                <select id="urgencia-tarea" required>
                    <option value="rutina">Rutina</option>
                    <option value="importante">Importante</option>
                    <option value="urgente">Urgente</option>
                    <option value="critica">Crítica</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Delegar Función</button>
        </form>
    </div>

    <!-- VISTA 3: GESTIÓN DE REGISTROS -->
    <div class="vista" id="vista-gestion">
        <h2 class="panel-titulo">Programas Activos (Clientes)</h2>
        <table class="tabla-gestion">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Curso al detal</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tbody-clientes">
                <tr><td colspan="4">Cargando...</td></tr>
            </tbody>
        </table>

        <h2 class="panel-titulo">Funciones Delegadas</h2>
        <table class="tabla-gestion">
            <thead>
                <tr>
                    <th>Responsable</th>
                    <th>Descripción</th>
                    <th>Estatus</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tbody-tareas">
                <tr><td colspan="4">Cargando...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function cambiarFormulario(vistaId) {
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`vista-${vistaId}`).classList.add('active');
            document.getElementById(`btn-${vistaId}`).classList.add('active');
        }

        const radiosTipoTarea = document.querySelectorAll('input[name="tipo-tarea"]');
        const grupoPrograma = document.getElementById('grupo-programa-vinculado');
        const selectPrograma = document.getElementById('programa-vinculado');

        radiosTipoTarea.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'vinculada') {
                    grupoPrograma.style.display = 'block';
                    selectPrograma.required = true;
                } else {
                    grupoPrograma.style.display = 'none';
                    selectPrograma.required = false;
                }
            });
        });

        async function cargarProgramasDropdown() {
            try {
                const res = await fetch('/api/clientes');
                if (!res.ok) throw new Error('Fallo en la red');
                const clientes = await res.json();
                selectPrograma.innerHTML = '<option value="" disabled selected>Selecciona un programa...</option>';
                clientes.forEach(c => {
                    const fechaStr = new Date(c.fecha_atencion).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
                    selectPrograma.innerHTML += `<option value="${c.id}">${fechaStr} - ${c.nombre_cliente}</option>`;
                });
            } catch (error) {
                console.error("Error cargando programas:", error);
            }
        }

        // --- LÓGICA DE LA PESTAÑA DE GESTIÓN ---
        async function cargarDatosGestion() {
            try {
                // Cargar Clientes
                const resC = await fetch('/api/clientes');
                const clientes = await resC.json();
                const tbC = document.getElementById('tbody-clientes');
                tbC.innerHTML = '';
                if(clientes.length === 0) tbC.innerHTML = '<tr><td colspan="4">No hay clientes programados</td></tr>';
                
                clientes.forEach(c => {
                    const fecha = new Date(c.fecha_atencion).toLocaleDateString();
                    tbC.innerHTML += `
                        <tr>
                            <td>${fecha}</td>
                            <td>${c.nombre_cliente}</td>
                            <td>${c.curso}</td>
                            <td><button class="btn-accion btn-borrar" onclick="borrarRegistro('clientes', ${c.id})">Borrar</button></td>
                        </tr>
                    `;
                });

                // Cargar Tareas
                const resT = await fetch('/api/tareas');
                const tareas = await resT.json();
                const tbT = document.getElementById('tbody-tareas');
                tbT.innerHTML = '';
                if(tareas.length === 0) tbT.innerHTML = '<tr><td colspan="4">No hay tareas delegadas</td></tr>';

                tareas.forEach(t => {
                    const estado = t.completada ? 'Completada' : 'Pendiente';
                    tbT.innerHTML += `
                        <tr>
                            <td>${t.responsable}</td>
                            <td>${t.descripcion.substring(0, 30)}...</td>
                            <td>${estado}</td>
                            <td><button class="btn-accion btn-borrar" onclick="borrarRegistro('tareas', ${t.id})">Borrar</button></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error cargando gestión:", error);
            }
        }

        async function borrarRegistro(tipo, id) {
            if(confirm('¿Estás seguro de que deseas eliminar este registro de la base de datos?')) {
                try {
                    const res = await fetch(`/api/${tipo}`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: id })
                    });
                    
                    if(res.ok) {
                        alert("✅ Registro eliminado correctamente.");
                        cargarDatosGestion(); 
                        cargarProgramasDropdown(); 
                    } else {
                        alert("Hubo un error al intentar eliminar el registro.");
                    }
                } catch (error) {
                    alert("Error de conexión al eliminar.");
                }
            }
        }

        // GUARDADO DE CLIENTES
        document.getElementById('form-cliente').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            btn.textContent = "Guardando...";
            btn.disabled = true;

            const nuevoCliente = {
                fecha_atencion: document.getElementById('fecha-cliente').value,
                logo_url: "COFTAH.png.png", // Temporalmente usa la imagen por defecto
                nombre_cliente: document.getElementById('nombre-cliente').value,
                lugar_atencion: document.getElementById('lugar-cliente').value,
                curso: document.getElementById('curso-cliente').value,
                facilitador: document.getElementById('facilitador-cliente').value,
                estatus: document.getElementById('estatus-cliente').value
            };

            try {
                const res = await fetch('/api/clientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoCliente)
                });

                if (res.ok) {
                    alert("✅ Cliente guardado exitosamente en Neon.");
                    this.reset();
                    cargarProgramasDropdown();
                    if(document.getElementById('vista-gestion').classList.contains('active')) cargarDatosGestion();
                } else {
                    alert("⚠️ Error al guardar el cliente en la base de datos.");
                }
            } catch (error) {
                alert("⚠️ Error de conexión con el servidor.");
            } finally {
                btn.textContent = "Guardar Cliente";
                btn.disabled = false;
            }
        });

        // GUARDADO DE TAREAS
        document.getElementById('form-tarea').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            btn.textContent = "Delegando...";
            btn.disabled = true;

            const tipoTarea = document.querySelector('input[name="tipo-tarea"]:checked').value;
            const nuevaTarea = {
                tipo_tarea: tipoTarea,
                programa_id: tipoTarea === 'vinculada' ? selectPrograma.value : null,
                responsable: document.getElementById('responsable-tarea').value,
                descripcion: document.getElementById('descripcion-tarea').value,
                fecha_limite: document.getElementById('fecha-tarea').value,
                urgencia: document.getElementById('urgencia-tarea').value
            };

            try {
                const res = await fetch('/api/tareas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevaTarea)
                });

                if (res.ok) {
                    alert("✅ Función delegada exitosamente.");
                    this.reset();
                    grupoPrograma.style.display = 'none';
                    if(document.getElementById('vista-gestion').classList.contains('active')) cargarDatosGestion();
                } else {
                    alert("⚠️ Error al delegar la función.");
                }
            } catch (error) {
                alert("⚠️ Error de conexión con el servidor.");
            } finally {
                btn.textContent = "Delegar Función";
                btn.disabled = false;
            }
        });

        cargarProgramasDropdown();
    </script>
</body>
</html>
