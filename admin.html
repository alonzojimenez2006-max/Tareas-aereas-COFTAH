<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dashboard COFTAH</title>
    <style>
        :root {
            --bg-principal: #0A192F; 
            --bg-paneles: #112240; 
            --texto-principal: #FFFFFF; 
            --texto-secundario: #8892B0; 
            --acento-amarillo: #FFD700; 
            --input-bg: #1A365D;
            --borde-input: #234E8A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg-paneles);
        }

        header img {
            height: 45px;
            width: auto;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--acento-amarillo);
            letter-spacing: 1px;
        }

        .tabs-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--bg-paneles);
            color: var(--texto-secundario);
            border: 2px solid transparent;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn:hover {
            color: var(--texto-principal);
            background-color: rgba(255, 215, 0, 0.1);
        }

        .tab-btn.active {
            background-color: rgba(255, 215, 0, 0.15);
            color: var(--acento-amarillo);
            border: 2px solid var(--acento-amarillo);
        }

        .vista {
            display: none; 
            background-color: var(--bg-paneles);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            max-width: 800px;
            margin: 0 auto;
        }

        .vista.active {
            display: block; 
        }

        .panel-titulo {
            font-size: 1.3rem;
            text-transform: uppercase;
            color: var(--acento-amarillo);
            margin-bottom: 25px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--texto-secundario);
            font-size: 0.95rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="datetime-local"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--borde-input);
            border-radius: 6px;
            color: var(--texto-principal);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="file"] {
            padding: 9px;
            cursor: pointer;
        }
        
        input[type="file"]::file-selector-button {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            border: 1px solid var(--acento-amarillo);
            padding: 8px 16px;
            border-radius: 4px;
            margin-right: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: var(--acento-amarillo);
            color: #000;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--acento-amarillo);
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Estilos para los Radio Buttons del tipo de tarea */
        .radio-group {
            display: flex;
            gap: 20px;
            background-color: var(--input-bg);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--borde-input);
        }

        .radio-opcion {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--texto-principal);
            font-size: 1rem;
        }

        .radio-opcion input[type="radio"] {
            accent-color: var(--acento-amarillo);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Animación suave para desplegar el selector de programas */
        #grupo-programa-vinculado {
            display: none;
            animation: fadeInDown 0.3s ease-out forwards;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        select option[value="rutina"] { background-color: #64FFDA; color: #000; }
        select option[value="importante"] { background-color: #FFD700; color: #000; }
        select option[value="urgente"] { background-color: #FF8C00; color: #fff; }
        select option[value="critica"] { background-color: #FF3366; color: #fff; }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: var(--acento-amarillo);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            background-color: #e6c200;
        }
    </style>
</head>
<body>

    <header>
        <img src="COFTAH.png.png" alt="Logo de COFTAH">
        <h1>PANEL DE ADMINISTRACIÓN</h1>
    </header>

    <div class="tabs-container">
        <button class="tab-btn active" id="btn-clientes" onclick="cambiarFormulario('clientes')">Programar Nuevo Cliente</button>
        <button class="tab-btn" id="btn-tareas" onclick="cambiarFormulario('tareas')">Delegar Nueva Función</button>
    </div>

    <!-- Vista 1: Formulario de Clientes -->
    <div class="vista active" id="vista-clientes">
        <h2 class="panel-titulo">Datos del Cliente</h2>
        <form id="form-cliente">
            <div class="form-group">
                <label for="fecha-cliente">Fecha y Hora de Atención</label>
                <input type="datetime-local" id="fecha-cliente" required>
            </div>
            
            <div class="form-group">
                <label for="logo-cliente">Logo de la Empresa (Formato PNG/JPG)</label>
                <input type="file" id="logo-cliente" accept="image/png, image/jpeg" required>
            </div>

            <div class="form-group">
                <label for="nombre-cliente">Nombre del Cliente / Empresa</label>
                <input type="text" id="nombre-cliente" placeholder="Ej. Industrias ACME" required>
            </div>
            
            <div class="form-group">
                <label for="lugar-cliente">Lugar de Atención</label>
                <input type="text" id="lugar-cliente" placeholder="Ej. Sala A, Remoto, Instalaciones del cliente" required>
            </div>
            
            <div class="form-group">
                <label for="curso-cliente">Curso al detal</label>
                <input type="text" id="curso-cliente" placeholder="Ej. Seguridad Industrial y Salud Ocupacional" required>
            </div>
            
            <div class="form-group">
                <label for="facilitador-cliente">Facilitador Asignado</label>
                <input type="text" id="facilitador-cliente" placeholder="Ej. Goretty M." required>
            </div>

            <div class="form-group">
                <label for="estatus-cliente">Estatus Inicial del Cliente</label>
                <select id="estatus-cliente" required>
                    <option value="programado" selected>Programado (Normal)</option>
                    <option value="importante">Aviso Próximo (Importante)</option>
                    <option value="retrasado">Retrasado (Urgente)</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Guardar Cliente en Cronograma</button>
        </form>
    </div>

    <!-- Vista 2: Formulario de Delegación de Funciones -->
    <div class="vista" id="vista-tareas">
        <h2 class="panel-titulo">Asignación de Tareas</h2>
        <form id="form-tarea">
            
            <!-- NUEVO: Selector de Tipo de Tarea -->
            <div class="form-group">
                <label>Tipo de Función a Delegar</label>
                <div class="radio-group">
                    <label class="radio-opcion">
                        <input type="radio" name="tipo-tarea" value="aislada" checked> Función Aislada
                    </label>
                    <label class="radio-opcion">
                        <input type="radio" name="tipo-tarea" value="vinculada"> Vincular a un Programa Creado
                    </label>
                </div>
            </div>

            <!-- Desplegable dinámico (Oculto por defecto) -->
            <div class="form-group" id="grupo-programa-vinculado">
                <label for="programa-vinculado">Seleccionar Programa Activo</label>
                <select id="programa-vinculado">
                    <option value="" disabled selected>Selecciona el cliente/programa correspondiente...</option>
                    <!-- Estos datos serán inyectados por la Base de Datos en la Fase 3 -->
                    <option value="id_1">12 Oct - Industrias ACME (Seguridad Industrial)</option>
                    <option value="id_2">13 Oct - TechCorp (Bases de Datos)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="responsable-tarea">Responsable (Personal interno)</label>
                <input type="text" id="responsable-tarea" placeholder="Ej. Carlos, Alonzo J." required>
            </div>
            
            <div class="form-group">
                <label for="descripcion-tarea">Descripción de la Tarea</label>
                <textarea id="descripcion-tarea" placeholder="Detalla las instrucciones precisas de la actividad..." required></textarea>
            </div>
            
            <div class="form-group">
                <label for="fecha-tarea">Fecha y Hora Límite</label>
                <input type="datetime-local" id="fecha-tarea" required>
            </div>
            
            <div class="form-group">
                <label for="urgencia-tarea">Nivel de Importancia / Urgencia</label>
                <select id="urgencia-tarea" required>
                    <option value="" disabled selected>Selecciona un nivel...</option>
                    <option value="rutina">Rutina (Baja)</option>
                    <option value="importante">Importante (Media)</option>
                    <option value="urgente">Urgente (Alta)</option>
                    <option value="critica">Crítica (Inmediata)</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Delegar Función al Equipo</button>
        </form>
    </div>

    <script>
        // Función para cambiar entre pestañas
        function cambiarFormulario(vistaId) {
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`vista-${vistaId}`).classList.add('active');
            document.getElementById(`btn-${vistaId}`).classList.add('active');
        }

        // Lógica para mostrar/ocultar el selector de programa vinculado
        const radiosTipoTarea = document.querySelectorAll('input[name="tipo-tarea"]');
        const grupoPrograma = document.getElementById('grupo-programa-vinculado');
        const selectPrograma = document.getElementById('programa-vinculado');

        radiosTipoTarea.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'vinculada') {
                    grupoPrograma.style.display = 'block';
                    selectPrograma.required = true; // Se vuelve obligatorio seleccionarlo
                } else {
                    grupoPrograma.style.display = 'none';
                    selectPrograma.required = false; // Ya no es obligatorio
                    selectPrograma.value = ""; // Resetea el valor por si acaso
                }
            });
        });

        // Simulación de envíos (Fase 3: Conexión a Base de Datos)
        document.getElementById('form-cliente').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Simulación: Cliente y logo registrados exitosamente.");
            this.reset();
        });

        document.getElementById('form-tarea').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Simulación: Función delegada exitosamente.");
            this.reset();
            // Asegurar que el selector se oculte tras enviar una tarea
            grupoPrograma.style.display = 'none';
            selectPrograma.required = false;
        });
    </script>
</body>
</html>
